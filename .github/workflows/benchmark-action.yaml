name: benchmarks

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

# Serialize baseline writers. The publication check below also rejects reruns of old commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write


# see https://github.com/benchmark-action/github-action-benchmark
jobs:
  benchmark:
    name: Performance regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Carvel Tools
        run: ./hack/install-deps.sh
      # Run benchmark with `go test -bench` and stores the output to a file
      - name: Setup k8s and Run benchmark
        shell: bash
        run: |
          set -euxo pipefail
          minikube start --driver=docker

          export KAPPCTRL_MINIKUBE_LOAD_IMAGES=true
          ./hack/deploy-test.sh

          go test ./test/bench/... -bench=. | tee output.txt
      # Download the latest benchmark baseline saved by develop (if exists). A unique key per attempt with
      # a prefix restore lets the baseline roll forward; a fixed key is never re-saved once it exists.
      - name: Download previous benchmark data
        uses: actions/cache/restore@v4
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-benchmark-
      - name: Check baseline publication
        id: baseline
        shell: bash
        env:
          PREVIOUS_DATA_HASH: ${{ hashFiles('cache/benchmark-data.json') }}
        run: |
          set -euo pipefail
          echo "data-hash=${PREVIOUS_DATA_HASH}" >> "${GITHUB_OUTPUT}"
          if [[ ! -f cache/benchmark-data.json ]]; then
            echo "No benchmark baseline found; this run cannot check relative regressions." >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ "${GITHUB_REF}" == refs/heads/develop ]]; then
            develop_sha=$(git ls-remote --exit-code origin refs/heads/develop | cut -f1)
            if [[ "${GITHUB_SHA}" == "${develop_sha}" ]]; then
              echo "publish=true" >> "${GITHUB_OUTPUT}"
            else
              echo "::notice::Develop has advanced; comparing this commit without publishing its results."
            fi
          fi
      # Run `github-action-benchmark` action
      # Only the current develop tip may update the baseline. PRs compare without publishing
      # (PRs can read caches saved on the base branch).
      - name: Compare (and on develop, store) benchmark result
        id: compare
        uses: benchmark-action/github-action-benchmark@1846227a307d8c0149b960b986d46f8f4c95db0c
        with:
          # What benchmark tool the output.txt came from
          tool: 'go'
          # Where the output from the benchmark tool is stored
          output-file-path: output.txt
          # Where the previous data file is stored
          external-data-json-path: ./cache/benchmark-data.json
          # Keep manual runs tied to the checked-out commit if the branch advances during the job
          ref: ${{ github.sha }}
          # Do not append PR results or obsolete develop results to the baseline
          save-data-file: ${{ steps.baseline.outputs.publish == 'true' }}
          alert-threshold: '125%'
          fail-on-alert: true
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Enable alert commit comment on develop (token is read-only on fork PRs)
          comment-on-alert: ${{ steps.baseline.outputs.publish == 'true' }}
          # Write the comparison table to the job summary (on alert it is in the failure message instead)
          summary-always: true
      # Save fresh results even after an alert. An unchanged restored file must not become a new baseline.
      - name: Save benchmark data
        uses: actions/cache/save@v4
        if: >-
          ${{ !cancelled() && steps.baseline.outputs.publish == 'true' &&
              steps.compare.outcome != 'skipped' && hashFiles('cache/benchmark-data.json') != '' &&
              hashFiles('cache/benchmark-data.json') != steps.baseline.outputs.data-hash }}
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      # Publishing charts uses a separate invocation from external JSON storage.
      - name: Store Result into Github Pages
        uses: benchmark-action/github-action-benchmark@1846227a307d8c0149b960b986d46f8f4c95db0c
        if: steps.baseline.outputs.publish == 'true'
        with:
          tool: 'go'
          output-file-path: output.txt
          ref: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push and deploy GitHub pages branch automatically
          auto-push: true
