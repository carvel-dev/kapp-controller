name: benchmarks

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write


# see https://github.com/benchmark-action/github-action-benchmark
jobs:
  benchmark:
    name: Performance regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # default version of go is 1.10
        with:
          go-version-file: go.mod
      - name: Install Carvel Tools
        run: ./hack/install-deps.sh
      # Run benchmark with `go test -bench` and stores the output to a file
      - name: Setup k8s and Run benchmark
        run: |
          set -e -x
          minikube start --driver=docker

          export KAPPCTRL_MINIKUBE_LOAD_IMAGES=true
          ./hack/deploy-test.sh

          go test ./test/bench/... -bench=. | tee output.txt
      # Download the latest benchmark baseline saved by develop (if exists). A unique key per run with
      # a prefix restore lets the baseline roll forward; a fixed key is never re-saved once it exists.
      - name: Download previous benchmark data
        uses: actions/cache/restore@v4
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark-
      # Run `github-action-benchmark` action
      # On develop the result is compared and appended to the baseline; on pull requests it is only
      # compared against the latest develop baseline (PRs can read caches saved on the base branch).
      - name: Compare (and on develop, store) benchmark result
        uses: benchmark-action/github-action-benchmark@1846227a307d8c0149b960b986d46f8f4c95db0c
        with:
          # What benchmark tool the output.txt came from
          tool: 'go'
          # Where the output from the benchmark tool is stored
          output-file-path: output.txt
          # Where the previous data file is stored
          external-data-json-path: ./cache/benchmark-data.json
          # Do not append PR results to the baseline
          save-data-file: ${{ github.ref == 'refs/heads/develop' }}
          alert-threshold: '125%'
          fail-on-alert: true
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Enable alert commit comment on develop (token is read-only on fork PRs)
          comment-on-alert: ${{ github.ref == 'refs/heads/develop' }}
          # Write the comparison table to the job summary (on alert it is in the failure message instead)
          summary-always: true
      # Save even when the alert fails the job so a regression is reported once, not on every later run
      - name: Save benchmark data
        uses: actions/cache/save@v4
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && hashFiles('cache/benchmark-data.json') != '' }}
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.run_id }}
      # I don't fully understand but the two storage options are mutually exclusive if they're in the same block
      - name: Store Result into Github Pages
        uses: benchmark-action/github-action-benchmark@1846227a307d8c0149b960b986d46f8f4c95db0c
        if: github.ref == 'refs/heads/develop'
        with:
          tool: 'go'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push and deploy GitHub pages branch automatically
          auto-push: true
